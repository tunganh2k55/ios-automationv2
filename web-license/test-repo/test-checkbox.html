<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Checkbox</title>
    <style>
        body { font-family: sans-serif; padding: 20px; font-size: 18px; }
        .checkbox-item { margin: 30px 0; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        input[type="checkbox"] { width: 30px; height: 30px; margin-right: 15px; }
        label { cursor: pointer; }
        button { margin-top: 30px; padding: 15px 30px; font-size: 18px; background: #007bff; color: white; border: none; border-radius: 8px; }
        .status { margin-top: 20px; padding: 15px; background: #f0f0f0; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>Test Click Checkbox</h1>

    <div class="checkbox-item">
        <input type="checkbox" id="terms" name="terms">
        <label for="terms">Đồng ý điều khoản (Terms)</label>
    </div>

    <div class="checkbox-item">
        <input type="checkbox" id="privacyPolicy" name="privacyPolicy">
        <label for="privacyPolicy">Đồng ý chính sách (Privacy Policy)</label>
    </div>

    <button id="submitBtn" onclick="checkStatus()">Submit</button>

    <div class="status" id="status">
        Trạng thái: Chưa check
    </div>

    <script>
        function checkStatus() {
            var terms = document.getElementById('terms').checked;
            var privacy = document.getElementById('privacyPolicy').checked;
            var status = 'Terms: ' + (terms ? 'YES' : 'NO') + ' | Privacy: ' + (privacy ? 'YES' : 'NO');
            document.getElementById('status').innerText = status;
            if (terms && privacy) {
                document.getElementById('status').style.background = '#90EE90';
            } else {
                document.getElementById('status').style.background = '#FFB6C1';
            }
        }

        // Auto update status when checkbox changes
        document.getElementById('terms').addEventListener('change', checkStatus);
        document.getElementById('privacyPolicy').addEventListener('change', checkStatus);
    </script>
</body>
</html>
